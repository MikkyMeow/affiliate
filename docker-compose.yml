version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: affilate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: affilate
      POSTGRES_PASSWORD: affilate
      POSTGRES_DB: affilate
    ports:
      - "6543:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affilate -d affilate']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: affilate-redis
    restart: unless-stopped
    ports:
      - "7379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: affilate-api
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://affilate:affilate@postgres:5432/affilate
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    expose:
      - "4000"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: affilate-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - backend/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://affilate:affilate@postgres:5432/affilate
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: affilate-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres-data:
    driver: local
