version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: affilate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: affilate
      POSTGRES_PASSWORD: affilate
      POSTGRES_DB: affilate
    ports:
      - "6543:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: affilate-redis
    restart: unless-stopped
    ports:
      - "7379:6379"

volumes:
  postgres-data:
    driver: local
