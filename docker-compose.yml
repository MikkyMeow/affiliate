version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: affiliate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: affiliate
      POSTGRES_DB: affiliate
    ports:
      - "6543:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affiliate -d affiliate']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: affiliate-redis
    restart: unless-stopped
    ports:
      - "7379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: affiliate-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://affiliate:affiliate@postgres:5432/affiliate
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    expose:
      - "4000"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    container_name: affiliate-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://affiliate:affiliate@postgres:5432/affiliate
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./frontend
    container_name: affiliate-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: affiliate-nginx
    restart: unless-stopped
    depends_on:
      - api
    # Public 80/443 are owned by ~/infra-proxy.
    # This nginx is internal only and must not publish host ports.
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres-data:
    driver: local
