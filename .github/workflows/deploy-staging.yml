name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.STAGING_PORT }}" -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Run staging deploy
        run: |
          ssh -vvv -i ~/.ssh/staging_key -p "${{ secrets.STAGING_PORT }}" \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "cd /home/deploy/affiliate && /home/deploy/affiliate/scripts/deploy-staging.sh"